name: Generate description for Claude PRs

on:
  workflow_run:
    workflows:
      - "Auto-create PR for Claude Branches"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to describe'
        required: true
        type: string

jobs:
  describe:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Get PR number
        id: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR="${{ inputs.pr_number }}"
            SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            PR=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -1)
            [ -z "$PR" ] && { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.setup.outputs.sha }}

      - name: Setup dev environment
        if: steps.setup.outputs.skip != 'true'
        uses: ./.github/actions/setup-dev-env

      - name: Generate and apply PR description
        if: steps.setup.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          claude_args: "--dangerously-skip-permissions"
          prompt: |
            Write a concise description for this PR and update the PR body by running:
            gh pr edit ${{ steps.setup.outputs.pr }} --body-file pr_description.md

            Use the Write tool to write the description to pr_description.md first, then run the gh command.
