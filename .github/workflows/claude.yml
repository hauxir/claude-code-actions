name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup dev environment
        uses: ./.github/actions/setup-dev-env

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          track_progress: true
          claude_args: "--dangerously-skip-permissions --allowedTools Bash"
          show_full_output: true
          prompt: |
            When working on a GitHub issue, push your changes to a branch named claude/issue-{number}-{YYYYMMDD}-{HHMM} (e.g. claude/issue-42-20260220-2057). The workflow will create the PR and generate the description automatically.
            Before committing, run the project's check/lint commands to verify there are no errors. Fix any errors before committing.
            IMPORTANT: When pushing, use a simple `git push origin <branch>` command with NO redirects (no 2>&1) and NO extra flags.
